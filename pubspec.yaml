name: bitchat
description: "A decentralized, offline-first Bluetooth Mesh Chat App."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Bluetooth P2P
  flutter_blue_plus: ^1.31.7
  ble_peripheral: ^2.4.0

  # Cryptography & Identifiers
  uuid: ^4.3.3
  pointycastle: ^3.7.3
  crypto: ^3.0.3

  # UI & Media
  qr_flutter: ^4.1.0
  animations: ^2.0.1
  cached_network_image: ^3.3.1
  intl: ^0.18.1
  share_plus: ^7.2.1
  file_picker: ^6.1.1
  image_picker: ^1.0.7

  # System & Utilities
  flutter_secure_storage: ^8.0.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Code Generation Annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

  # Generators
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

